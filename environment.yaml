name: lomap-env
channels:
  - conda-forge
dependencies:
  - networkx
  - numpy
  - matplotlib
  # https://github.com/rdkit/rdkit/issues/9335
  - rdkit != 2024.03.4, != 2026.03.3
  - pytest
  - pytest-xdist
  - codecov
  - duecredit
  - citeproc-py <0.10.3  # the default harvard1 style used by duecredit was changed in 0.10.3, this avoids needing an extra dependency on citeproc-py-styles
